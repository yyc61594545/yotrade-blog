name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 清缓存那步要 diff 出这次 push 改了哪些文章

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm

      - run: npm ci
      - run: npm run build

      # Cloudflare Pages 在真实多节点并发下有不明原因的间歇性 504（2026-08 排查未果），
      # 已迁移为直接从 VPS (69.5.53.68) 用 nginx 提供静态文件，不再依赖 Pages。
      - name: Deploy to VPS via rsync
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          # VPS 偶发不可达（2026-09-02 就因一次 Connection timed out 丢了当天部署，
          # 连带把 IndexNow 一起跳过）。重试三次，间隔递增。
          for attempt in 1 2 3; do
            if rsync -avz --delete --timeout=60 \
                 -e "ssh -p 19789 -i ~/.ssh/deploy_key -o ConnectTimeout=30" \
                 dist/ root@69.5.53.68:/opt/ai-relay/blog-dist/; then
              echo "rsync 成功（第 $attempt 次）"
              exit 0
            fi
            echo "::warning::rsync 第 $attempt 次失败"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 30)); fi
          done
          echo "::error::rsync 三次均失败，本次内容已合并到 main 但未部署"
          exit 1

      # Cache Rule "Edge-cache blog HTML" 用 override_origin 强制边缘缓存 24h，
      # 新文章本身是全新 URL 会立即可见，但这些「发现入口」会停留在旧版本，
      # 导致首页不列出新文章、sitemap/RSS 延迟被抓取。部署后精准清掉它们。
      # 文章页不清 —— 它们内容不变，继续享受 24h 缓存。
      - name: Collect changed post slugs
        id: changed
        run: |
          # 这次 push 新增/改动的文章 slug，清缓存与 IndexNow 两步共用。
          base="${{ github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then base="${{ github.sha }}~1"; fi
          slugs=$(git diff --name-only "$base" "${{ github.sha }}" -- src/content/blog/ \
                  | sed -En 's#^src/content/blog/(.*)\.mdx?$#\1#p' | head -23 | paste -sd, -)
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
          echo "changed posts: ${slugs:-（无）}"

      - name: Purge discovery surfaces + changed posts from Cloudflare cache
        continue-on-error: true   # 清缓存失败不应阻断部署；失败会在此步显示为红叉
        env:
          SLUGS: ${{ steps.changed.outputs.slugs }}
        run: |
          set -o pipefail
          # 固定的发现页 + 这次 push 新增/改动的文章 URL。文章 URL 也要清：
          # Cloudflare 会把部署前有人访问过的新文章 404 缓存住（2026-09-22 踩过，缓存的 404 存了 3 分钟以上），
          # 不清的话新文章上线后一段时间内仍然 404。单次 purge 最多 30 个 URL。
          files='"https://blog.yotradeapi.com/","https://blog.yotradeapi.com/blog/","https://blog.yotradeapi.com/categories/","https://blog.yotradeapi.com/tags/","https://blog.yotradeapi.com/sitemap-index.xml","https://blog.yotradeapi.com/sitemap-0.xml","https://blog.yotradeapi.com/rss.xml","https://blog.yotradeapi.com/llms.txt","https://blog.yotradeapi.com/robots.txt"'
          for s in $(echo "$SLUGS" | tr ',' ' '); do
            files="$files,\"https://blog.yotradeapi.com/blog/$s/\""
          done
          echo "purging: $files"
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data "{\"files\":[$files]}" | tee /dev/stderr | grep -q '"success":true'

      - name: Notify IndexNow
        # 手动 push 的文章也要通知搜索引擎（覆盖 Bing / Yandex / Naver，Google 不支持 IndexNow）。
        # 日更走 daily-autopublish.yml 里的同名步骤；合并到 main 后这里会再提交一次，重复提交无副作用。
        if: steps.changed.outputs.slugs != ''
        continue-on-error: true
        env:
          SLUGS: ${{ steps.changed.outputs.slugs }}
        run: |
          python3 <<'PYEOF'
          import os, json, urllib.request as r

          KEY = '0618cefdb7e64035a4b169a872de5a78'
          slugs = [s for s in os.environ['SLUGS'].split(',') if s]
          if not slugs:
              print('SLUGS 空，跳过')
              raise SystemExit(0)

          payload = {
              'host': 'blog.yotradeapi.com',
              'key': KEY,
              'keyLocation': f'https://blog.yotradeapi.com/{KEY}.txt',
              'urlList': [f'https://blog.yotradeapi.com/blog/{s}/' for s in slugs],
          }
          req = r.Request('https://api.indexnow.org/indexnow',
                          data=json.dumps(payload).encode(),
                          headers={'Content-Type': 'application/json; charset=utf-8'},
                          method='POST')
          resp = r.urlopen(req, timeout=15)
          print(f'IndexNow notified: HTTP {resp.status} for {len(slugs)} URLs')
          PYEOF
